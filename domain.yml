version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - bot_challenge
  - track_shipment
  - book_shipment
  - cancel_shipment
  - get_shipping_rates
  - nearest_branch
  - schedule_pickup


entities:
  - tracking_id
  - from_location
  - to_location
  - nearest_branch

slots:
  tracking_id:
    type: text
    mappings:
      - type: from_entity
        entity: tracking_id

#-------------- Book Shipment -------------
  sender_name:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: sender_name

  sender_contact_number:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: sender_contact_number

  sender_email:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: sender_email

  receiver_name:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: receiver_name

  receiver_contact_number:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: receiver_contact_number

  delivery_location:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: delivery_location

  booking_confirmation_pending:
    type: bool
    initial_value: false
    influence_conversation: true
    mappings:
      - type: custom

#--------------- Get Rates -----------
  from_location:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: rates_form
            requested_slot: from_location

  to_location:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: rates_form
            requested_slot: to_location

#--------------- nearest branch -----------
  nearest_branch:
    type: text
    mappings:
      - type: from_entity
        entity: nearest_branch
      - type: from_text
        conditions:
          - active_loop: branch_form
            requested_slot: nearest_branch

#--------------- Schedule Pickup ------------
  pickup_name:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: pickup_form
            requested_slot: pickup_name

  pickup_contact:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: pickup_form
            requested_slot: pickup_contact

  pickup_address:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: pickup_form
            requested_slot: pickup_address

  pickup_date:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: pickup_form
            requested_slot: pickup_date

  pickup_time:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: pickup_form
            requested_slot: pickup_time
        
forms:
  tracking_form:
    required_slots:
      - tracking_id
      
  booking_form:
    required_slots:
      - sender_name
      - sender_contact_number
      - sender_email
      - receiver_name
      - receiver_contact_number
      - delivery_location

  rates_form:
    required_slots:
      - from_location
      - to_location

  branch_form:
    required_slots:
      - nearest_branch

  pickup_form:
    required_slots:
      - pickup_name
      - pickup_contact
      - pickup_address
      - pickup_date
      - pickup_time


responses:
  utter_greet_bot:
    - text: |
        Hello 👋 I am LogiBot – Your Logistics Assistant.

        How can I help you today?
      buttons:
        - title: "📦Track Shipment"
          payload: "/track_shipment"
        - title: "🚚Book New Shipment"
          payload: "/book_shipment"
        - title: "❌Cancel Shipment"
          payload: "/cancel_shipment"
        - title: "💰Get Shipping Rates"
          payload: "/get_shipping_rates"
        - title: "📍Find nearest branch"
          payload: "/nearest_branch"
        - title: "Schedule Pickup"
          payload: "/schedule_pickup"  

#-------------- Track Shipment ------------
  utter_ask_tracking_id:
   - text: "Please provide your tracking id."

#-------------- Book Shipment -------------
  utter_ask_sender_name:
   - text: "Enter senders name."

  utter_ask_sender_contact_number:
   - text: "Enter senders contact number."

  utter_ask_sender_email:
   - text: "Enter senders email."

  utter_ask_receiver_name:
   - text: "Enter receivers name." 

  utter_ask_receiver_contact_number:
   - text: "Enter receivers contact number." 

  utter_ask_delivery_location:
   - text: "Enter delivery location."

#------------- Get Rates -----------------
  utter_ask_from_location:
   - text: "Please enter pickup location." 

  utter_ask_to_location:
  - text: "Please enter delivery location." 

#-------------- Confirm Booking ----------------
  utter_ask_confirm_booking:
    - text: |
        Please review your details:

        Sender: {sender_name}
        Sender_Contact: {sender_contact_number}
        Email: {sender_email}
        
        Receiver: {receiver_name}
        Receiver_Contact: {receiver_contact_number}
        Address: {delivery_location}
        
        Confirm booking?
      buttons:
        - title: "Yes"
          payload: "/affirm"
        - title: "No"
          payload: "/deny"   

#-------------- Nearest Branch ---------------
  utter_ask_nearest_branch:
    - text: "Please provide the name of the city from where you are planning to send your shipment:"       

  utter_did_that_help:
    - text: "Did that help you?"

  utter_happy:
    - text: "Great, carry on!"

  utter_goodbye:
    - text: "Bye"

  utter_iamabot:
    - text: "I am a bot, powered by Rasa."

#----------------- Schedule Pickup ----------------
  utter_ask_pickup_name:
    - text: "Enter your name."

  utter_ask_pickup_contact:
    - text: "Enter your contact number."

  utter_ask_pickup_address:
    - text : "Enter pickup address."

  utter_ask_pickup_date:
    - text: "Enter pickup date."

  utter_pickup_time:
    - text: "Enter pickup time."

  utter_cancelled:
    - text: "Okay 👍 I've cancelled the current process. How else can I help?"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

actions:
  - action_track_shipment
  - action_book_shipment
  - validate_booking_form
  - action_cancel_booking
  - action_get_shipping_rates
  - action_get_nearest_branch
  - action_schedule_pickup
  - validate_pickup_form