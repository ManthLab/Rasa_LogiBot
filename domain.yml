version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - stop
  - bot_challenge
  - track_shipment
  - book_shipment
  - cancel_shipment
  - cancel_booking
  - check_rates
  - inform
  - nearest_branch
  - schedule_pickup
  - ask_help
  - thank_you
  - confirm_booking
  - ask_offers
  - contact_support
  - nlu_fallback
  - out_of_scope

  #-------------------- Multi-intents ---------------
  - greet+track_shipment
  - greet+book_shipment
  - greet+get_shipping_rates
  - greet+schedule_pickup
  - greet+nearest_branch
  - greet+contact_support
  - greet+ask_offers
  - track_shipment+ask_help
  - track_shipment+book_shipment
  - track_shipment+contact_support
  - book_shipment+get_shipping_rates
  - book_shipment+schedule_pickup
  - thank_you+goodbye
  - thank_you+book_shipment
  - nearest_branch+book_shipment
  - nearest_branch+schedule_pickup
  - check_rates+schedule_pickup
  - check_rates+nearest_branch


entities:
  - tracking_id
  - nearest_branch
  - from_location
  - to_location


slots:
  # ── Tracking ──────────────────────────────
  tracking_id:
    type: text
    mappings:
      - type: from_entity
        entity: tracking_id

  # ── Book Shipment ─────────────────────────
  sender_name:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: sender_name

  sender_contact_number:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: sender_contact_number

  sender_email:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: sender_email

  receiver_name:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: receiver_name

  receiver_contact_number:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: receiver_contact_number

  delivery_address:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: delivery_address

  delivery_city:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: delivery_city

  delivery_pincode:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: delivery_pincode

  # ── Shipping Rates ────────────────────────
  destination_country:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: rates_form
            requested_slot: destination_country
        not_intent:
          - stop
          - deny
          - cancel_shipment

  from_pincode:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: rates_form
            requested_slot: from_pincode
        not_intent:
          - stop
          - deny
          - cancel_shipment

  to_pincode:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: rates_form
            requested_slot: to_pincode
        not_intent:
          - stop
          - deny
          - cancel_shipment

  shipment_type:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: rates_form
            requested_slot: shipment_type
        not_intent:
          - stop
          - deny
          - cancel_shipment

  weight_grams:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: rates_form
            requested_slot: weight_grams
        not_intent:
          - stop
          - deny
          - cancel_shipment

  length_cm:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: rates_form
            requested_slot: length_cm
        not_intent:
          - stop
          - deny
          - cancel_shipment

  width_cm:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: rates_form
            requested_slot: width_cm
        not_intent:
          - stop
          - deny
          - cancel_shipment

  height_cm:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: rates_form
            requested_slot: height_cm
        not_intent:
          - stop
          - deny
          - cancel_shipment

  # ── Nearest Branch ────────────────────────
  nearest_branch:
    type: text
    mappings:
      - type: from_entity
        entity: nearest_branch
      - type: from_text
        conditions:
          - active_loop: branch_form
            requested_slot: nearest_branch

  # ── Schedule Pickup ───────────────────────
  pickup_name:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: pickup_form
            requested_slot: pickup_name

  pickup_contact:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: pickup_form
            requested_slot: pickup_contact

  pickup_address:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: pickup_form
            requested_slot: pickup_address

  pickup_date:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: pickup_form
            requested_slot: pickup_date

  pickup_time:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: pickup_form
            requested_slot: pickup_time

# ── City context for rates ───────────────────
  from_city:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  to_city:
    type: text
    influence_conversation: false
    mappings:
      - type: custom


forms:
  tracking_form:
    required_slots:
      - tracking_id

  booking_form:
    required_slots:
      - sender_name
      - sender_contact_number
      - sender_email
      - receiver_name
      - receiver_contact_number
      - delivery_address
      - delivery_city
      - delivery_pincode

  rates_form:
    required_slots:
      - destination_country
      - from_pincode
      - to_pincode
      - shipment_type
      - weight_grams
      - length_cm
      - width_cm
      - height_cm

  branch_form:
    required_slots:
      - nearest_branch

  pickup_form:
    required_slots:
      - pickup_name
      - pickup_contact
      - pickup_address
      - pickup_date
      - pickup_time


responses:
  # ── Greeting ──────────────────────────────
  utter_greet_bot:
    - text: |
        👋 Hello! I'm **LogiBot** – Your Smart Logistics Assistant.

        I can help you with:
      buttons:
        - title: "📦 Track Shipment"
          payload: "/track_shipment"
        - title: "🚚 Book New Shipment"
          payload: "/book_shipment"
        - title: "💰 Shipping Rates"
          payload: "/check_rates"
        - title: "📍 Find Nearest Branch"
          payload: "/nearest_branch"
        - title: "🔄 Schedule Pickup"
          payload: "/schedule_pickup"

  # ── Track Shipment ────────────────────────
  utter_ask_tracking_id:
    - text: "🔍 Please enter your **Tracking ID** (e.g. XYZ12345):"

  # ── Book Shipment ─────────────────────────
  utter_ask_sender_name:
    - text: "📝 Let's set up your shipment!\n\n👤 Please enter the **sender's full name**:"

  utter_ask_sender_contact_number:
    - text: "📞 Enter the **sender's 10-digit mobile number**:"

  utter_ask_sender_email:
    - text: "📧 Enter the **sender's email address**:"

  utter_ask_receiver_name:
    - text: "👤 Enter the **receiver's full name**:"

  utter_ask_receiver_contact_number:
    - text: "📞 Enter the **receiver's 10-digit mobile number**:"

  utter_ask_delivery_address:
    - text: |
        🏠 Enter the **delivery street address** (house/flat no. + street name):
        _(e.g. Flat 5B, Shiv Nagar, MG Road)_

  utter_ask_delivery_city:
    - text: "🏙️ Enter the **delivery city**:"

  utter_ask_delivery_pincode:
    - text: "📮 Enter the **6-digit pincode** of the delivery location:"

  # ── Shipping Rates ────────────────────────
  utter_rates_cancelled:
    - text: "No problem! 👋 Feel free to ask whenever you're ready to check shipping rates. I'm here to help! 🚚"

  utter_ask_destination_country:
    - text: "🌍 Please enter the destination country (e.g., India, Germany, USA)"

  utter_ask_from_pincode:
    - condition:
        - type: slot
          name: from_city
          value: null
      text: "📍 Enter the sender's pincode (pickup location):"

    - text: "📍 Enter the sender's pincode for {from_city} (pickup location):"


  utter_ask_to_pincode:
    - condition:
        - type: slot
          name: to_city
          value: null
      text: "📍 Enter the receiver's pincode (delivery location):"

    - text: "📍 Enter the receiver's pincode for {to_city} (delivery location):"

  utter_ask_shipment_type:
    - text: "📋 Is your shipment a **Document** or **Non-Document**?"
      buttons:
        - title: "📄 Document"
          payload: "document"
        - title: "📦 Non-Document"
          payload: "non-document"

  utter_ask_weight_grams:
    - text: "⚖️ Enter the **weight** of your shipment:\n_(e.g. 220 grams, 1.5 kg, 500)_"

  utter_ask_length_cm:
    - text: "📐 Enter the **length** of the package in cm:"

  utter_ask_width_cm:
    - text: "📐 Enter the **width** of the package in cm:"

  utter_ask_height_cm:
    - text: "📐 Enter the **height** of the package in cm:"

  # ── Nearest Branch ────────────────────────
  utter_ask_nearest_branch:
    - text: |
        🏢 Which city are you looking for a branch in?

        We currently have branches in:
        Mumbai | Delhi | Bangalore | Ahmedabad
      buttons:
        - title: "Mumbai"
          payload: "Mumbai"
        - title: "Delhi"
          payload: "Delhi"
        - title: "Bangalore"
          payload: "Bangalore"
        - title: "Ahmedabad"
          payload: "Ahmedabad"

  # ── Schedule Pickup ───────────────────────
  utter_ask_pickup_name:
    - text: "📦 Let's schedule your pickup!\n\n👤 Enter your **full name**:"

  utter_ask_pickup_contact:
    - text: "📞 Enter your **10-digit contact number**:"

  utter_ask_pickup_address:
    - text: |
        🏠 Enter the **full pickup address** (include flat/house no., street, area):
        _(e.g. 12A, Sai Nagar, Link Road, Borivali West)_

  utter_ask_pickup_date:
    - text: |
        📅 Enter your **preferred pickup date**:
        _(e.g. 15 March 2026 or 2026-03-15)_

  utter_ask_pickup_time:
    - text: |
        🕐 Enter your **preferred pickup time**:
        _(Available: 9:00 AM – 6:00 PM)_
        _(e.g. 10 AM, 2:30 PM)_

  # ── Offers ────────────────────────────────
  utter_ask_offers:
    - text: |
        🔖 *Current Offers at LogiExpress*

        🔥 **20% OFF First Shipment**  
        New customers get a special discount on their first delivery.

        ⚡ **Same Day Delivery Available**  
        Express shipping available in selected cities.

        📦 **Send 3 Shipments – Pay for 2**  
        Ship more and save more this week!

        Would you like to book a shipment now?
      buttons:
        - title: "🚚 Book Shipment"
          payload: "/book_shipment"
        - title: "💰 Rates"
          payload: "/check_rates"
        - title: "🔄 Pickup"
          payload: "/schedule_pickup"
        - title: "🏠 Main Menu"
          payload: "/greet"

  # ── General ───────────────────────────────
  utter_cancelled:
    - text: |
        ❌ Process cancelled.

        What else can I help you with?
      buttons:
        - title: "📦 Track Shipment"
          payload: "/track_shipment"
        - title: "🚚 Book Shipment"
          payload: "/book_shipment"
        - title: "🏠 Main Menu"
          payload: "/greet"

  utter_goodbye:
    - text: "👋 Goodbye! Have a great day. Feel free to come back anytime. 😊"

  utter_iamabot:
    - text: "🤖 I'm **LogiBot**, a virtual assistant powered by Rasa & LogiExpress. How can I help you?"

  utter_thank_you:
    - text: "😊 You're welcome! Is there anything else I can help you with?"
      buttons:
        - title: "🏠 Main Menu"
          payload: "/greet"
        - title: "No, that's all"
          payload: "/goodbye"

  utter_help:
    - text: |
        🆘 **Here's what I can do for you:**

        📦 **Track Shipment** – Real-time shipment tracking
        🚚 **Book Shipment** – Schedule a new delivery
        💰 **Shipping Rates** – Get instant cost estimates
        📍 **Nearest Branch** – Find branch near you
        🔄 **Schedule Pickup** – Book a home pickup

        Which service do you need?
      buttons:
        - title: "📦 Track"
          payload: "/track_shipment"
        - title: "🚚 Book"
          payload: "/book_shipment"
        - title: "💰 Rates"
          payload: "/check_rates"
        - title: "📍 Branch"
          payload: "/nearest_branch"
        - title: "🔄 Pickup"
          payload: "/schedule_pickup"

  utter_did_that_help:
    - text: "Did that help you? 😊"
      buttons:
        - title: "Yes, thanks!"
          payload: "/thank_you"
        - title: "No, need more help"
          payload: "/ask_help"

  utter_default:
    - text: |
        🤔 I'm not sure I understood that.

        Here's what I can help you with:
      buttons:
        - title: "📦 Track Shipment"
          payload: "/track_shipment"
        - title: "🚚 Book Shipment"
          payload: "/book_shipment"
        - title: "💰 Shipping Rates"
          payload: "/check_rates"
        - title: "📍 Nearest Branch"
          payload: "/nearest_branch"
        - title: "🔄 Schedule Pickup"
          payload: "/schedule_pickup"

  utter_fallback:
    - text: "I'm sorry, I didn't quite understand that. 😕"
    - text: "Hmm, I couldn't understand your message. Could you rephrase?"
    - text: "I'm not sure what you mean. Could you try again?"

  utter_out_of_scope:
    - text: "That's outside what I can help with. I'm a logistics assistant — I can help you track shipments, book deliveries, check rates, find branches, or schedule pickups. 📦"
    - text: "I can only assist with logistics services. Try asking me about tracking, booking, or shipping rates!"

  utter_ask_rephrase:
    - text: "Sorry, I didn't catch that. Could you please rephrase? 🙏"
    - text: "I'm not sure I understood. Could you try saying that differently?"
    - text: "Could you clarify that? I want to make sure I get it right. 😊"

  # ── Contact Support ───────────────────────
  utter_contact_support:
    - text: |
        📞 *LogiExpress Customer Support*

        🕐 *Support Hours:* Mon–Sat, 9:00 AM – 6:00 PM

        📱 *Call Us:*
        • Toll-Free : 1800-123-4567
        • WhatsApp  : +91 9082840443

        📧 *Email Us:*
        • mail_on   : support@logiexpress.in

        📍 *Head Office:*
        LogiExpress Pvt. Ltd.
        5th Floor, MindSpace Tower No.09,
        Airoli West, Mumbai – 400708.

        🌐 *Website:* www.logiexpress.in

        _Our team typically responds within 2–4 business hours._
      buttons:
        - title: "🏠 Main Menu"
          payload: "/greet"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true


actions:
  - action_track_shipment
  - action_book_shipment
  - validate_booking_form
  - action_cancel_booking
  - action_get_shipping_rates
  - validate_rates_form
  - action_prefill_rates
  - action_cancel_rates_form
  - action_get_nearest_branch
  - action_schedule_pickup
  - validate_pickup_form
  - action_cancel_active_form
  - action_session_start
  - action_reset_logistics_slots
  - action_ask_confirm_booking