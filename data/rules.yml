version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Greet user
  steps:
    - intent: greet
    - action: utter_greet_bot

# -------- TRACKING --------

- rule: Track shipment
  steps:
    - intent: track_shipment
    - action: action_track_shipment

# -------- BOOKING --------

- rule: Start booking form
  steps:
    - intent: book_shipment
    - action: booking_form
    - active_loop: booking_form

- rule: Submit booking form
  condition:
  - active_loop: booking_form
  steps:
  - action: booking_form
  - active_loop: null
  - action: utter_ask_confirm_booking

- rule: Confirm booking
  steps:
    - intent: affirm
    - action: action_book_shipment

- rule: Cancel booking after confirmation
  steps:
    - intent: deny
    - action: action_cancel_booking


# ---------- SHIPPING RATES -------------

- rule: Start rates form
  steps:
    - intent: get_shipping_rates
    - action: rates_form
    - active_loop: rates_form

- rule: Submit rates form
  condition:
    - active_loop: rates_form
  steps:
    - action: rates_form
    - active_loop: null
    - action: action_get_shipping_rates

#------------ Nearest Branch --------------

- rule: Start nearest branch form
  steps:
    - intent: nearest_branch
    - action: branch_form
    - active_loop: branch_form

- rule: Submit branch form
  condition:
    - active_loop: branch_form
  steps:
    - action: branch_form
    - active_loop: null
    - action: action_get_nearest_branch
    
# -------- SCHEDULE PICKUP --------

- rule: Start pickup form
  steps:
    - intent: schedule_pickup
    - action: pickup_form
    - active_loop: pickup_form

- rule: Submit pickup form
  condition:
    - active_loop: pickup_form
  steps:
    - action: pickup_form
    - active_loop: null
    - action: action_schedule_pickup

- rule: Stop pickup form if user changes intent
  condition:
    - active_loop: pickup_form
  steps:
    - intent: nlu_fallback
    - action: action_deactivate_loop
    - active_loop: null

- rule: Cancel any active form
  condition:
    - active_loop: pickup_form
  steps:
    - intent: deny
    - action: action_deactivate_loop
    - active_loop: null
    - action: utter_cancelled