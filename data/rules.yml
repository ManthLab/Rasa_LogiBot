version: "3.1"

rules:

# ── Core ──────────────────────────────────────────────────────────────────

- rule: Greet user
  steps:
    - intent: greet
    - action: utter_greet_bot

- rule: Say goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: Say I am a bot
  steps:
    - intent: bot_challenge
    - action: utter_iamabot

- rule: Help user
  steps:
    - intent: ask_help
    - action: utter_help

- rule: Thank you response
  steps:
    - intent: thank_you
    - action: utter_thank_you

# ── Track Shipment ────────────────────────────────────────────────────────

- rule: Start tracking form
  steps:
    - intent: track_shipment
    - action: tracking_form
    - active_loop: tracking_form

- rule: Submit tracking form
  condition:
    - active_loop: tracking_form
  steps:
    - action: tracking_form
    - active_loop: null
    - action: action_track_shipment

- rule: Stop tracking form
  condition:
    - active_loop: tracking_form
  steps:
    - intent: stop
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_cancel_active_form

# ── Book Shipment ─────────────────────────────────────────────────────────

- rule: Start booking form
  steps:
    - intent: book_shipment
    - action: booking_form
    - active_loop: booking_form

- rule: Submit booking form
  condition:
    - active_loop: booking_form
  steps:
    - action: booking_form
    - active_loop: null
    - slot_was_set:
        - requested_slot: null
    - action: utter_ask_confirm_booking

- rule: confirm shipment booking
  steps:
    - intent: confirm_booking
    - action: action_book_shipment

- rule: cancel shipment booking
  steps:
    - intent: cancel_booking
    - action: action_cancel_booking 

- rule: Stop booking form
  condition:
    - active_loop: booking_form
  steps:
    - intent: stop
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_cancel_active_form

# NOTE: affirm -> action_book_shipment and deny -> action_cancel_booking
# are handled ONLY in stories.yml to avoid RulePolicy conflicts.

# ── Shipping Rates ────────────────────────────────────────────────────────

- rule: Start rates form
  steps:
    - intent: get_shipping_rates
    - action: rates_form
    - active_loop: rates_form

- rule: Submit rates form
  condition:
    - active_loop: rates_form
  steps:
    - action: rates_form
    - active_loop: null
    - action: action_get_shipping_rates

- rule: Stop rates form
  condition:
    - active_loop: rates_form
  steps:
    - intent: stop
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_cancel_active_form

# ── Nearest Branch ────────────────────────────────────────────────────────

- rule: Start branch form
  steps:
    - intent: nearest_branch
    - action: branch_form
    - active_loop: branch_form

- rule: Submit branch form
  condition:
    - active_loop: branch_form
  steps:
    - action: branch_form
    - active_loop: null
    - action: action_get_nearest_branch

- rule: Stop branch form
  condition:
    - active_loop: branch_form
  steps:
    - intent: stop
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_cancel_active_form

# ── Schedule Pickup ───────────────────────────────────────────────────────

- rule: Start pickup form
  steps:
    - intent: schedule_pickup
    - action: pickup_form
    - active_loop: pickup_form

- rule: Submit pickup form
  condition:
    - active_loop: pickup_form
  steps:
    - action: pickup_form
    - active_loop: null
    - action: action_schedule_pickup

- rule: Stop pickup form
  condition:
    - active_loop: pickup_form
  steps:
    - intent: stop
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_cancel_active_form

- rule: Deny pickup form
  condition:
    - active_loop: pickup_form
  steps:
    - intent: deny
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_cancel_active_form