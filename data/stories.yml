# ── Pickup: full flow ─────────────────────────────────────────────────────
- story: pickup scheduled
  steps:
    - intent: schedule_pickup
    - action: action_reset_logistics_slots
    - action: pickup_form
    - active_loop: pickup_form
    - active_loop: null
    - action: action_schedule_pickup

# ── Pickup: scheduled then greet ─────────────────────────────────────────
- story: pickup scheduled then continue
  steps:
    - intent: schedule_pickup
    - action: action_reset_logistics_slots
    - action: pickup_form
    - active_loop: pickup_form
    - active_loop: null
    - action: action_schedule_pickup
    - intent: greet
    - action: utter_greet_bot

# ── Track ─────────────────────────────────────────────────────────────────
- story: track shipment
  steps:
    - intent: track_shipment
    - action: action_reset_logistics_slots
    - action: tracking_form
    - active_loop: tracking_form
    - active_loop: null
    - action: action_track_shipment

# ── Rates ─────────────────────────────────────────────────────────────────
- story: get rates
  steps:
    - intent: check_rates
    - action: action_reset_logistics_slots
    - action: action_prefill_rates   
    - action: rates_form
    - active_loop: rates_form
    - active_loop: null
    - action: action_get_shipping_rates

# ── Rates cancelled with stop ─────────────────────────────────────────────
- story: get rates cancelled stop
  steps:
    - intent: check_rates
    - action: action_reset_logistics_slots
    - action: action_prefill_rates   
    - action: rates_form
    - active_loop: rates_form
    - intent: stop
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_cancel_rates_form

# ── Rates cancelled with deny ─────────────────────────────────────────────
- story: get rates cancelled deny
  steps:
    - intent: check_rates
    - action: action_reset_logistics_slots
    - action: action_prefill_rates
    - action: rates_form
    - active_loop: rates_form
    - intent: deny
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_cancel_rates_form

# ── Rates cancelled with cancel_shipment ──────────────────────────────────
- story: get rates cancelled cancel_shipment
  steps:
    - intent: check_rates
    - action: action_reset_logistics_slots
    - action: action_prefill_rates
    - action: rates_form
    - active_loop: rates_form
    - intent: cancel_shipment
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_cancel_rates_form

# ── Rates then book ───────────────────────────────────────────────────────
- story: rates then book confirmed
  steps:
    - intent: check_rates
    - action: action_reset_logistics_slots
    - action: action_prefill_rates   
    - action: rates_form
    - active_loop: rates_form
    - active_loop: null
    - action: action_get_shipping_rates
    - intent: book_shipment
    - action: action_reset_logistics_slots
    - action: booking_form
    - active_loop: booking_form
    - active_loop: null
    - action: action_ask_confirm_booking
    - intent: confirm_booking
    - action: action_book_shipment

# ── Branch ────────────────────────────────────────────────────────────────
- story: nearest branch
  steps:
    - intent: nearest_branch
    - action: action_reset_logistics_slots
    - action: branch_form
    - active_loop: branch_form
    - active_loop: null
    - action: action_get_nearest_branch

# ── Greet then book ───────────────────────────────────────────────────────
- story: greet then book confirmed
  steps:
    - intent: greet
    - action: utter_greet_bot
    - intent: book_shipment
    - action: action_reset_logistics_slots
    - action: booking_form
    - active_loop: booking_form
    - active_loop: null
    - action: action_ask_confirm_booking
    - intent: confirm_booking
    - action: action_book_shipment

# ── Greet then pickup ─────────────────────────────────────────────────────
- story: greet then pickup
  steps:
    - intent: greet
    - action: utter_greet_bot
    - intent: schedule_pickup
    - action: action_reset_logistics_slots
    - action: pickup_form
    - active_loop: pickup_form
    - active_loop: null
    - action: action_schedule_pickup

# ── Thank you ─────────────────────────────────────────────────────────────
- story: thank you
  steps:
    - intent: thank_you
    - action: utter_thank_you

# ── Goodbye ───────────────────────────────────────────────────────────────
- story: goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

#---------------------- Fallback recovery -------------------

- story: fallback then help
  steps:
    - intent: nlu_fallback
    - action: utter_fallback
    - action: utter_help            
    - intent: book_shipment
    - action: action_reset_logistics_slots
    - action: booking_form
    - active_loop: booking_form
    - active_loop: null
    - action: action_ask_confirm_booking
    - intent: confirm_booking
    - action: action_book_shipment

- story: fallback then goodbye     
  steps:
    - intent: nlu_fallback
    - action: utter_fallback
    - action: utter_help            
    - intent: goodbye
    - action: utter_goodbye

- story: out of scope then redirect 
  steps:
    - intent: out_of_scope
    - action: utter_out_of_scope
    - intent: ask_help
    - action: utter_help