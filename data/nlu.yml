version: "3.1"

nlu:
- intent: greet
  examples: |
    - hey
    - hello
    - hi
    - hello there
    - good morning
    - good evening
    - moin
    - hey there
    - let's go
    - hey dude
    - goodmorning
    - goodevening
    - good afternoon


- intent: track_shipment
  examples: |
    - Track Shipment
    - Track my order
    - Track my shipment
    - I want to track a parcel
    - Where is my order?
    - Track Shipment
    - Track my order [XYZ12345](tracking_id)
    - It's [XYZ2150](tracking_id)
    - [ABC3567](tracking_id)
    - [MNO0637](tracking_id)
    - Where is [123456](tracking_id)
    - Check status of [AWB67890](tracking_id)

- intent: book_shipment
  examples: |
    - Book a shipment
    - Want to book a new shipment
    - Shipment booking
    - Booking shipment
    - Send parcel
    - Create shipment
    - I want to book a shipment

- intent: cancel_shipment
  examples: |
    - cancel my shipment
    - I want to cancel
    - Cancel

- intent: affirm
  examples: |
    - yes
    - y
    - indeed
    - of course
    - that sounds good
    - correct

- intent: deny
  examples: |
    - no
    - n
    - never
    - I don't think so
    - don't like that
    - no way
    - not really
    - cancel
    - not now 
    - cancel booking

- intent: bot_challenge
  examples: |
    - are you a bot?
    - are you a human?
    - am I talking to a bot?
    - am I talking to a human?
